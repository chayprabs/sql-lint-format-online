name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build core (types for web)
        run: pnpm --filter @sqlguard/core build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: |
          TOTAL=0
          FOUND=0
          for f in packages/web/dist/assets/index-*.js packages/web/dist/assets/vendor-*.js; do
            if [ -f "$f" ]; then
              FOUND=$((FOUND + 1))
              TOTAL=$((TOTAL + $(wc -c < "$f")))
            fi
          done
          if [ "$FOUND" -lt 2 ]; then
            echo "Expected index-*.js and vendor-*.js in dist/assets"
            exit 1
          fi
          echo "Initial load JS bytes (index+vendor): $TOTAL"
          MAX=1572864
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "Initial bundle exceeds 1.5 MB budget"
            exit 1
          fi
          MONACO=0
          for f in packages/web/dist/assets/monaco-*.js; do
            [ -f "$f" ] && MONACO=$((MONACO + $(wc -c < "$f")))
          done
          echo "Monaco lazy chunk bytes: $MONACO"

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps
        working-directory: packages/web

      - name: E2E
        run: pnpm test:e2e
