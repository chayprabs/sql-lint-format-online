name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sqlguard/core build
      - name: Build web for GitHub Pages
        run: pnpm --filter @sqlguard/web build
        env:
          VITE_BASE_PATH: /sql-lint-format-online/

      - name: SPA fallback for GitHub Pages
        run: cp packages/web/dist/index.html packages/web/dist/404.html

      - name: Detect GitHub Pages
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Enable it under Settings → Pages → Build and deployment: GitHub Actions, then re-run this workflow."
          fi

      - uses: actions/configure-pages@v4
        if: steps.pages-enabled.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-enabled.outputs.enabled == 'true'
        with:
          path: packages/web/dist

      - id: deployment
        if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
